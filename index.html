<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liftglass</title>
<meta name="description" content="Log your workouts: weights, reps, personal bests and progress.">
<meta name="theme-color" content="#e8ecf5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05070d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: one phone-width column floating over a moving colour field; every surface is frosted glass; floating glass tab bar at the bottom. */
:root{
  --bg:#e8ecf5;
  --ink:#0c111e;
  --ink-2:rgba(12,17,30,.64);
  --ink-3:rgba(12,17,30,.42);
  --glass:rgba(255,255,255,.5);
  --glass-strong:rgba(255,255,255,.74);
  --glass-edge:rgba(255,255,255,.78);
  --glass-hi:rgba(255,255,255,.95);
  --glass-lo:rgba(16,24,48,.07);
  --sheen:rgba(255,255,255,.6);
  --shadow:rgba(28,40,84,.18);
  --fill:rgba(110,122,160,.13);
  --line:rgba(12,17,30,.08);
  --accent:#0b6bff;
  --accent-ink:#ffffff;
  --good:#11a465;
  --pr:#e39500;
  --danger:#e3343d;
  --blob1:#ff7a59; --blob2:#3c7bff; --blob3:#2fd3ac; --blob4:#b067ff;
  --blob-op:.78;
  --scrim:rgba(20,26,44,.22);
  --f-ui:-apple-system,"SF Pro Text","Google Sans Text","Google Sans",system-ui,Roboto,"Segoe UI",sans-serif;
  --f-num:"SF Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#05070d; --ink:#f2f4fa; --ink-2:rgba(242,244,250,.66); --ink-3:rgba(242,244,250,.4);
    --glass:rgba(38,44,62,.42); --glass-strong:rgba(50,56,76,.7); --glass-edge:rgba(255,255,255,.13);
    --glass-hi:rgba(255,255,255,.24); --glass-lo:rgba(0,0,0,.35); --sheen:rgba(255,255,255,.09);
    --shadow:rgba(0,0,0,.5); --fill:rgba(255,255,255,.08); --line:rgba(255,255,255,.08);
    --accent:#3d8bff; --accent-ink:#ffffff; --good:#33d196; --pr:#ffbd3a; --danger:#ff5a61;
    --blob1:#ff5c3a; --blob2:#2a64ff; --blob3:#14b892; --blob4:#8a45ff; --blob-op:.5;
    --scrim:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#05070d; --ink:#f2f4fa; --ink-2:rgba(242,244,250,.66); --ink-3:rgba(242,244,250,.4);
  --glass:rgba(38,44,62,.42); --glass-strong:rgba(50,56,76,.7); --glass-edge:rgba(255,255,255,.13);
  --glass-hi:rgba(255,255,255,.24); --glass-lo:rgba(0,0,0,.35); --sheen:rgba(255,255,255,.09);
  --shadow:rgba(0,0,0,.5); --fill:rgba(255,255,255,.08); --line:rgba(255,255,255,.08);
  --accent:#3d8bff; --accent-ink:#ffffff; --good:#33d196; --pr:#ffbd3a; --danger:#ff5a61;
  --blob1:#ff5c3a; --blob2:#2a64ff; --blob3:#14b892; --blob4:#8a45ff; --blob-op:.5;
  --scrim:rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html{color-scheme:light}
body{margin:0;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* moving colour field behind the glass */
.field{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:var(--blob-op);will-change:transform}
.b1{width:62vmax;height:62vmax;left:-22vmax;top:-18vmax;background:var(--blob1);animation:d1 26s ease-in-out infinite alternate}
.b2{width:58vmax;height:58vmax;right:-26vmax;top:8vh;background:var(--blob2);animation:d2 32s ease-in-out infinite alternate}
.b3{width:50vmax;height:50vmax;left:-12vmax;bottom:-22vmax;background:var(--blob3);animation:d3 29s ease-in-out infinite alternate}
.b4{width:40vmax;height:40vmax;right:-8vmax;bottom:6vh;background:var(--blob4);animation:d1 35s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(12vmax,10vmax) scale(1.12)}}
@keyframes d2{to{transform:translate(-14vmax,16vmax) scale(.9)}}
@keyframes d3{to{transform:translate(16vmax,-10vmax) scale(1.08)}}
@media (prefers-reduced-motion: reduce){.blob{animation:none}}

/* the glass material */
.glass{position:relative;isolation:isolate;background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(175%);backdrop-filter:blur(22px) saturate(175%);
  border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px var(--glass-lo),0 14px 34px -14px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:linear-gradient(155deg,var(--sheen),transparent 42%)}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(132px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 4px 4px}
.top-text{min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:2px 0 0;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}

.card{border-radius:28px;padding:16px}
.section-title{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:10px 6px -4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 24px -10px var(--accent)}
.btn.soft{background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi)}
.btn.ghost{color:var(--ink-2)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:active,.chip:active,.tick:active{transform:scale(.97)}

/* start card */
.start h2{margin:0;font-size:22px;letter-spacing:-.02em}
.start p{margin:4px 0 14px;color:var(--ink-2)}
.field-input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--fill);padding:0 16px;font-size:16px;outline:none}
.field-input:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.chip{min-height:38px;padding:0 15px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi);font-weight:600;font-size:14px}
.chip small{font-weight:500;color:var(--ink-3);margin-left:4px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border-radius:22px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-num);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--ink-2)}

/* active workout */
.wk-head{display:flex;flex-direction:column;gap:4px}
.wk-name{width:100%;border:0;background:transparent;font-size:24px;font-weight:700;letter-spacing:-.02em;padding:0;outline:none}
.wk-meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--ink-2);font-size:14px}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 22%,transparent)}

.ex{padding:14px 12px 10px}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 8px}
.ex-name{font-size:17px;font-weight:700;letter-spacing:-.01em;text-align:left;color:var(--accent);min-width:0}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);flex:none}
.icon-btn svg{width:18px;height:18px}
.set-row{display:grid;grid-template-columns:26px minmax(0,1fr) 74px 60px 42px;gap:6px;align-items:center;padding:4px;border-radius:16px;transition:background .2s}
.set-row.hdr{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-block:0 2px}
.set-row.hdr span:nth-child(3),.set-row.hdr span:nth-child(4){text-align:center}
.set-n{font-family:var(--f-num);font-weight:600;color:var(--ink-2);text-align:center}
.prev{font-family:var(--f-num);font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.num{width:100%;height:42px;border-radius:12px;border:1px solid transparent;background:var(--fill);text-align:center;font-family:var(--f-num);font-size:16px;font-weight:600;outline:none;font-variant-numeric:tabular-nums}
.num::placeholder{color:var(--ink-3);font-weight:500}
.num:focus{border-color:var(--accent);background:var(--glass-strong)}
.tick{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink-3);transition:background .2s,color .2s}
.tick svg{width:20px;height:20px}
.set-row.done{background:color-mix(in srgb,var(--good) 15%,transparent)}
.set-row.done .tick{background:var(--good);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.set-row.done .num{background:transparent}
.set-row.pr{background:color-mix(in srgb,var(--pr) 18%,transparent)}
.set-row.pr .tick{background:var(--pr)}
.set-row.pr .set-n{color:var(--pr)}
.ex-foot{display:flex;gap:6px;padding:6px 2px 0}
.ex-foot .btn{min-height:40px;padding:0 14px;font-size:14px}

.add-ex{border-radius:24px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;color:var(--accent);width:100%}
.add-ex svg{width:20px;height:20px}
.finish{display:flex;flex-direction:column;gap:6px;margin-top:4px}

/* history */
.month{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:8px 6px -4px}
.hist{display:block;width:100%;text-align:left}
.hist-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hist-top strong{font-size:18px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-top span{color:var(--ink-2);font-size:13px;flex:none}
.hist-meta{color:var(--ink-2);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.ex-list{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.ex-list li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ex-list li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-list li span:last-child{font-family:var(--f-num);font-size:13px;color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums}

/* progress */
.prog{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;align-items:center;width:100%;text-align:left}
.prog strong{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog small{display:block;color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
.prog svg{width:96px;height:34px;display:block}

.empty{text-align:center;padding:30px 20px}
.empty h2{margin:6px 0 4px;font-size:20px}
.empty p{margin:0 auto 14px;color:var(--ink-2);max-width:32ch}
.empty .glyph{width:56px;height:56px;margin:0 auto;border-radius:18px;display:grid;place-items:center;color:var(--accent);background:var(--fill)}
.empty .glyph svg{width:28px;height:28px}

/* floating tab bar */
.tabbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:6px;border-radius:999px;width:min(340px,calc(100% - 32px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:999px;font-size:11px;font-weight:600;color:var(--ink-2);transition:background .25s,color .25s}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--glass-hi),0 4px 14px -6px var(--shadow)}

/* rest timer */
.rest{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:19;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;border-radius:999px;width:max-content;max-width:calc(100% - 32px)}
.rest .lbl{font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.rest .t{font-family:var(--f-num);font-size:20px;font-weight:600;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.rest button{height:36px;min-width:44px;padding:0 10px;border-radius:999px;background:var(--fill);font-weight:600;font-size:13px}
.rest.over .t{color:var(--good)}
.rest.over{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.05)}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88vh;overflow:auto;overscroll-behavior:contain;
  border-radius:30px 30px 0 0;border-bottom:0;background:var(--glass-strong);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.5;margin:0 auto 4px}
.sheet h2{margin:0;font-size:24px;letter-spacing:-.02em}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .sub{color:var(--ink-2);margin-top:-8px}
.pick-list{display:flex;flex-direction:column}
.pick-group{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:12px 4px 4px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line);font-size:16px}
.pick small{color:var(--ink-3);font-size:13px;font-family:var(--f-num)}
.pick.new{color:var(--accent);font-weight:600}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--fill)}
.seg button{flex:1;min-height:38px;border-radius:999px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:inset 0 1px 0 var(--glass-hi),0 3px 10px -4px var(--shadow)}
.setting{display:flex;flex-direction:column;gap:8px}
.setting label{font-weight:600}
.note{font-size:13px;color:var(--ink-2)}
.detail-ex{border-top:1px solid var(--line);padding-top:10px}
.detail-ex h3{margin:0 0 6px;font-size:16px}
.detail-sets{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--f-num);font-size:13px;padding:5px 10px;border-radius:999px;background:var(--fill);font-variant-numeric:tabular-nums}
.pill.pr{background:color-mix(in srgb,var(--pr) 24%,transparent)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-family:var(--f-num);font-size:10px}
.mini-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini-stats div{background:var(--fill);border-radius:16px;padding:10px 12px}
.mini-stats b{display:block;font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.mini-stats span{font-size:12px;color:var(--ink-2)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:40;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;transition:transform .3s cubic-bezier(.2,.9,.25,1);background:var(--glass-strong)}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.sheet,.toast,.scrim{transition:none}.rest.over{animation:none}}
</style>
</head>
<body>

<div class="field" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>

<main class="app">
  <header class="top">
    <div class="top-text"><div class="eyebrow" id="eyebrow"></div><h1 id="title">Today</h1></div>
    <button class="glass round" id="settings-btn" data-act="settings" aria-label="Settings"></button>
  </header>
  <div id="view" style="display:flex;flex-direction:column;gap:14px"></div>
</main>

<div class="glass rest" id="rest" hidden>
  <span class="lbl">Rest</span><span class="t" id="rest-t">1:30</span>
  <button data-act="rest-add" data-s="-15" aria-label="Remove 15 seconds">−15</button>
  <button data-act="rest-add" data-s="15" aria-label="Add 15 seconds">+15</button>
  <button data-act="rest-stop" aria-label="Stop rest timer">Skip</button>
</div>

<nav class="glass tabbar" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-act="tab" data-tab="log" id="tab-log"></button>
  <button class="tab" role="tab" data-act="tab" data-tab="history" id="tab-history"></button>
  <button class="tab" role="tab" data-act="tab" data-tab="progress" id="tab-progress"></button>
</nav>

<div class="scrim" id="scrim" hidden data-act="close-sheet"></div>
<div class="glass sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-in" id="sheet-in"></div></div>
<div class="glass toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- icons ---------- */
const I={

  lift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',

/* ---------- exercise library ---------- */
const LIB={
  Chest:["Bench press","Incline bench press","Dumbbell bench press","Incline dumbbell press","Chest fly","Cable crossover","Push-up","Dip"],
  Back:["Deadlift","Pull-up","Chin-up","Barbell row","Dumbbell row","Lat pulldown","Seated cable row","T-bar row","Face pull"],
  Legs:["Squat","Front squat","Romanian deadlift","Leg press","Bulgarian split squat","Walking lunge","Leg extension","Leg curl","Hip thrust","Calf raise"],
  Shoulders:["Overhead press","Dumbbell shoulder press","Lateral raise","Rear delt fly","Arnold press","Shrug"],
  Arms:["Bicep curl","Hammer curl","Preacher curl","Triceps pushdown","Skull crusher","Overhead triceps extension","Close-grip bench press"],
  Core:["Plank","Hanging leg raise","Cable crunch","Ab wheel rollout","Russian twist"]
};
const TEMPLATES={
  "Push":["Bench press","Overhead press","Incline dumbbell press","Lateral raise","Triceps pushdown"],
  "Pull":["Pull-up","Barbell row","Lat pulldown","Face pull","Bicep curl"],
  "Legs":["Squat","Romanian deadlift","Leg press","Leg curl","Calf raise"],
  "Upper":["Bench press","Barbell row","Overhead press","Lat pulldown","Bicep curl","Triceps pushdown"],
  "Lower":["Deadlift","Front squat","Bulgarian split squat","Leg extension","Calf raise"],
  "Full body":["Squat","Bench press","Barbell row","Overhead press","Plank"]
};

/* ---------- state ---------- */
const LS='liftglass.v1';
const S={workouts:{},settings:{unit:'kg',rest:90},tab:'log'};
let pendingRender=false;

function loadLocal(){try{const raw=localStorage.getItem(LS);if(!raw)return;const d=JSON.parse(raw);if(d.workouts)S.workouts=d.workouts;if(d.settings)S.settings=Object.assign(S.settings,d.settings);}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({workouts:S.workouts,settings:S.settings}))}catch(e){toast('Couldn’t save. Your phone may be out of storage.')}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function persist(){saveLocal()}
/* ask the browser not to clear our data when the phone is low on space */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* backups */
function exportBackup(){
  const data=JSON.stringify({app:'liftglass',version:1,exportedAt:new Date().toISOString(),workouts:S.workouts,settings:S.settings},null,1);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='liftglass-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast('Backup saved to your Downloads');
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||d.app!=='liftglass'||typeof d.workouts!=='object')throw 0;
      let n=0;
      Object.values(d.workouts).forEach(w=>{if(w&&w.id&&w.kind==='workout'&&w.finishedAt&&!S.workouts[w.id]){S.workouts[w.id]=w;n++}});
      saveLocal();render();closeSheet();
      toast(n?'Restored '+n+' workout'+(n===1?'':'s'):'Nothing new in that backup');
    }catch(e){toast('That file isn’t a Liftglass backup')}
  };
  r.readAsText(file);
}

function renderSoon(){
  const a=document.activeElement;
  if(a&&a.tagName==='INPUT'&&document.getElementById('view').contains(a)){pendingRender=true;return}
  render();
}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender){const a=document.activeElement;if(!(a&&a.tagName==='INPUT')){pendingRender=false;render()}}},50)});

/* ---------- units & formatting ---------- */
const LB=2.2046226;
const unit=()=>S.settings.unit;
function toDisp(kg){if(kg==null||kg==='')return null;const v=unit()==='lb'?kg*LB:kg;return Math.round(v*100)/100}
function fromDisp(v){if(v===''||v==null||isNaN(v))return null;const n=+v;return unit()==='lb'?n/LB:n}
function fw(kg){const v=toDisp(kg);if(v==null)return '';return (Math.round(v*10)/10).toString()}
function setTxt(s){if(!s)return '—';const w=s.w>0?fw(s.w):'BW';return w+' × '+(s.r??'—')}
function vol(kg){const v=toDisp(kg)||0;return v>=10000?(v/1000).toFixed(1)+'k':Math.round(v).toLocaleString('en-GB')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const dFmt=t=>new Date(t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const mFmt=t=>new Date(t).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
function dur(ms){const m=Math.max(1,Math.round(ms/60000));return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+' min'}
function clock(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);

/* ---------- queries ---------- */
const all=()=>Object.values(S.workouts);
const active=()=>all().find(w=>!w.finishedAt);
const finished=()=>all().filter(w=>w.finishedAt).sort((a,b)=>b.startedAt-a.startedAt);
const doneSets=e=>e.sets.filter(s=>s.done&&s.r>0);
const same=(a,b)=>a.trim().toLowerCase()===b.trim().toLowerCase();
function lastSetsFor(name){for(const w of finished()){const e=w.exercises.find(x=>same(x.name,name));if(e&&doneSets(e).length)return doneSets(e)}return null}
function bestFor(name){let b=0;finished().forEach(w=>w.exercises.forEach(e=>{if(same(e.name,name))doneSets(e).forEach(s=>{if((s.w||0)>b)b=s.w})}));return b}
function wkStats(w){let sets=0,v=0;w.exercises.forEach(e=>doneSets(e).forEach(s=>{sets++;v+=(s.w||0)*s.r}));return {sets,v}}
function exStats(){
  const m={};
  finished().slice().reverse().forEach(w=>w.exercises.forEach(e=>{
    const ds=doneSets(e);if(!ds.length)return;
    const k=e.name.trim().toLowerCase();
    const x=m[k]||(m[k]={name:e.name,sessions:[],best:0,bestE:0,bestSet:null});
    let top=ds[0];ds.forEach(s=>{if((s.w||0)>(top.w||0)||((s.w||0)===(top.w||0)&&s.r>top.r))top=s});
    const be=Math.max(...ds.map(s=>e1rm(s.w||0,s.r)));
    x.sessions.push({t:w.startedAt,top,e:be,sets:ds});
    if((top.w||0)>x.best||!x.bestSet){x.best=top.w||0;x.bestSet=top}
    if(be>x.bestE)x.bestE=be;
    x.last=w.startedAt;
  }));
  return Object.values(m).sort((a,b)=>b.last-a.last);
}

/* ---------- actions ---------- */
function newExercise(name){
  const last=lastSetsFor(name);const n=last?Math.min(Math.max(last.length,1),6):3;
  return {id:'e'+uid(),name,sets:Array.from({length:n},()=>({w:null,r:null,done:false}))};
}
function startWorkout(name,list){
  if(active()){toast('Finish or discard your current workout first');S.tab='log';render();return}
  const id='w'+uid();
  S.workouts[id]={id,kind:'workout',name:name||'Workout',startedAt:Date.now(),finishedAt:null,exercises:(list||[]).map(newExercise)};
  persist(id);S.tab='log';closeSheet();render();window.scrollTo({top:0});
}
function placeholder(w,ei,si,field){
  const e=w.exercises[ei];const prevInRow=si>0?e.sets[si-1][field]:null;
  if(prevInRow!=null)return prevInRow;
  const last=lastSetsFor(e.name);const ls=last&&(last[si]||last[last.length-1]);
  return ls?ls[field]:null;
}
function finishWorkout(){
  const w=active();if(!w)return;
  const ex=w.exercises.map(e=>Object.assign({},e,{sets:doneSets(e)})).filter(e=>e.sets.length);
  if(!ex.length){toast('Tick off at least one set, or discard this workout');return}
  w.exercises=ex;w.finishedAt=Date.now();
  persist(w.id);stopRest();render();toast('Workout saved');openWorkout(w.id);
}

/* ---------- rendering ---------- */
const view=document.getElementById('view');
function render(){
  pendingRender=false;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===S.tab)));
  const now=new Date();
  document.getElementById('eyebrow').textContent=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  const a=active();
  document.getElementById('title').textContent=S.tab==='log'?(a?'In progress':'Today'):S.tab==='history'?'History':'Progress';
  view.innerHTML=S.tab==='log'?(a?activeView(a):homeView()):S.tab==='history'?historyView():progressView();
  tickClocks();
}

function homeView(){
  const fin=finished();
  const mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const wk=fin.filter(w=>w.startedAt>=mon.getTime());
  let sets=0,v=0;wk.forEach(w=>{const s=wkStats(w);sets+=s.sets;v+=s.v});
  const chips=Object.keys(TEMPLATES).map(k=>`<button class="chip" data-act="template" data-t="${esc(k)}">${esc(k)}<small>${TEMPLATES[k].length}</small></button>`).join('');
  let h=`<section class="glass card start">
    <h2>Start a workout</h2>
    <p>Pick a split to preload exercises, or start empty and add as you go.</p>
    <input class="field-input" id="start-name" placeholder="Workout name, e.g. Push day" autocomplete="off" enterkeyhint="go">
    <div class="chips">${chips}</div>
    <button class="btn primary block" data-act="start-empty">${I.plus}Start empty workout</button>
  </section>
  <div class="section-title">This week</div>
  <div class="stats">
    <div class="glass stat"><b>${wk.length}</b><span>workouts</span></div>
    <div class="glass stat"><b>${sets}</b><span>sets done</span></div>
    <div class="glass stat"><b>${vol(v)}</b><span>${unit()} lifted</span></div>
  </div>`;
  if(fin.length){h+=`<div class="section-title">Last workout</div>`+histCard(fin[0])}
  return h;
}

function activeView(w){
  const {sets}=wkStats(w);
  let h=`<section class="glass card"><div class="wk-head">
    <input class="wk-name" id="wk-name" value="${esc(w.name)}" aria-label="Workout name" autocomplete="off">
    <div class="wk-meta"><span class="live" data-elapsed="${w.startedAt}">0:00</span><span>${w.exercises.length} exercise${w.exercises.length===1?'':'s'}</span><span>${sets} set${sets===1?'':'s'} done</span></div>
  </div></section>`;
  w.exercises.forEach((e,ei)=>{
    const last=lastSetsFor(e.name);const best=bestFor(e.name);
    h+=`<section class="glass card ex" data-ei="${ei}">
      <div class="ex-head"><button class="ex-name" data-act="ex-progress" data-name="${esc(e.name)}">${esc(e.name)}</button>
      <button class="icon-btn" data-act="ex-remove" data-ei="${ei}" data-confirm="Remove" aria-label="Remove ${esc(e.name)}">${I.x}</button></div>
      <div class="set-row hdr"><span>Set</span><span>Last time</span><span>${unit()}</span><span>Reps</span><span></span></div>`;
    e.sets.forEach((s,si)=>{
      const pw=placeholder(w,ei,si,'w'),pr=placeholder(w,ei,si,'r');
      const isPR=s.done&&best>0&&(s.w||0)>best;
      const ls=last&&last[si];
      h+=`<div class="set-row${s.done?' done':''}${isPR?' pr':''}">
        <span class="set-n">${si+1}</span>
        <span class="prev">${ls?esc(setTxt(ls)):'—'}</span>
        <input class="num" inputmode="decimal" aria-label="Weight set ${si+1}" data-ei="${ei}" data-si="${si}" data-f="w" value="${s.w!=null?fw(s.w):''}" placeholder="${pw!=null?fw(pw):unit()}">
        <input class="num" inputmode="numeric" aria-label="Reps set ${si+1}" data-ei="${ei}" data-si="${si}" data-f="r" value="${s.r??''}" placeholder="${pr??'0'}">
        <button class="tick" data-act="set-done" data-ei="${ei}" data-si="${si}" aria-pressed="${s.done}" aria-label="Mark set ${si+1} done">${I.check}</button>
      </div>`;
    });
    h+=`<div class="ex-foot"><button class="btn soft" data-act="set-add" data-ei="${ei}">${I.plus}Add set</button>${e.sets.length>1?`<button class="btn ghost" data-act="set-remove" data-ei="${ei}">Remove last</button>`:''}</div></section>`;
  });
  h+=`<button class="glass add-ex" data-act="picker">${I.plus}Add exercise</button>
  <div class="finish"><button class="btn primary block" data-act="finish">${I.check}Finish workout</button>
  <button class="btn ghost danger block" data-act="discard" data-confirm="Tap again to discard this workout">Discard workout</button></div>`;
  return h;
}

function histCard(w){
  const s=wkStats(w);
  const lis=w.exercises.slice(0,5).map(e=>{const ds=doneSets(e);let top=ds[0];ds.forEach(x=>{if((x.w||0)>(top.w||0))top=x});return `<li><span>${esc(e.name)}</span><span>${ds.length} × · ${esc(setTxt(top))}</span></li>`}).join('');
  const more=w.exercises.length>5?`<li><span style="color:var(--ink-3)">+${w.exercises.length-5} more</span><span></span></li>`:'';
  return `<button class="glass card hist" data-act="open-workout" data-id="${w.id}">
    <div class="hist-top"><strong>${esc(w.name)}</strong><span>${dFmt(w.startedAt)}</span></div>
    <div class="hist-meta">${dur(w.finishedAt-w.startedAt)} · ${s.sets} sets · ${vol(s.v)} ${unit()}</div>
    <ul class="ex-list">${lis}${more}</ul></button>`;
}

function emptyState(title,text){
  return `<section class="glass card empty"><div class="glyph">${I.lift}</div><h2>${title}</h2><p>${text}</p>
  <button class="btn primary" data-act="tab" data-tab="log">Start a workout</button></section>`;
}

function historyView(){
  const fin=finished();
  if(!fin.length)return emptyState('No workouts yet','Finished workouts land here with every set, weight and rep you logged.');
  let h='',m='';
  fin.forEach(w=>{const k=mFmt(w.startedAt);if(k!==m){m=k;h+=`<div class="month">${k}</div>`}h+=histCard(w)});
  return h;
}

function spark(vals){
  if(vals.length<2)return `<svg viewBox="0 0 96 34"><circle cx="48" cy="17" r="3.5" fill="var(--accent)"/></svg>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[3+i*(90/(vals.length-1)),30-(v-mn)/r*26]);
  const d=pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const l=pts[pts.length-1];
  return `<svg viewBox="0 0 96 34" aria-hidden="true"><polyline points="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="3.2" fill="var(--accent)"/></svg>`;
}

function progressView(){
  const xs=exStats();
  if(!xs.length)return emptyState('Nothing to chart yet','Log a few sessions and each exercise gets its own trend line and personal best.');
  return `<div class="section-title">Heaviest set per session</div>`+xs.map(x=>`<button class="glass card prog" data-act="ex-progress" data-name="${esc(x.name)}">
    <div style="min-width:0"><strong>${esc(x.name)}</strong><small>Best ${esc(setTxt(x.bestSet))} · ${x.sessions.length} session${x.sessions.length===1?'':'s'}</small></div>
    ${spark(x.sessions.slice(-12).map(s=>toDisp(s.top.w||0)))}</button>`).join('');
}

function bigChart(sessions){
  const W=320,H=170,L=38,R=12,T=12,B=24;
  const vals=sessions.map(s=>toDisp(s.top.w||0));
  let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mn===mx){mn=mn-5;mx=mx+5}
  const span=mx-mn,step=[1,2,2.5,5,10,20,25,50,100].find(s=>span/s<=4)||200;
  const lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step;
  const y=v=>T+(H-T-B)*(1-(v-lo)/((hi-lo)||1));
  const x=i=>vals.length===1?(L+W-R)/2:L+i*((W-L-R)/(vals.length-1));
  let g='';
  for(let v=lo;v<=hi+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${+v.toFixed(1)}</text>`}
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=vals.length>1?`<polygon points="${L},${H-B} ${line} ${(W-R)},${H-B}" fill="var(--accent)" opacity=".14"/>`:'';
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4.5:2.6}" fill="var(--accent)"/>`).join('');
  const f=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const xl=`<text x="${L}" y="${H-6}">${f(sessions[0].t)}</text>`+(sessions.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end">${f(sessions[sessions.length-1].t)}</text>`:'');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heaviest set per session in ${unit()}">${g}${area}<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
}

/* ---------- sheets ---------- */
const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim'),sheetIn=document.getElementById('sheet-in');
let sheetKind=null;
function openSheet(html,kind){
  sheetKind=kind||null;
  sheetIn.innerHTML='<div class="grab"></div>'+html;
  sheet.hidden=false;scrim.hidden=false;sheet.scrollTop=0;
  requestAnimationFrame(()=>{sheet.classList.add('on');scrim.classList.add('on')});
}
function closeSheet(){
  if(sheet.hidden)return;
  sheet.classList.remove('on');scrim.classList.remove('on');sheetKind=null;
  setTimeout(()=>{if(!sheet.classList.contains('on')){sheet.hidden=true;scrim.hidden=true}},320);
}
const closeBtn=`<button class="icon-btn" data-act="close-sheet" aria-label="Close">${I.x}</button>`;

function openPicker(){
  openSheet(`<div class="sheet-head"><h2>Add exercise</h2>${closeBtn}</div>
  <input class="field-input" id="pick-q" placeholder="Search or type a new exercise" autocomplete="off" enterkeyhint="done">
  <div class="pick-list" id="pick-list"></div>`,'picker');
  fillPicker('');
}
function fillPicker(q){
  const w=active();const have=new Set((w?w.exercises:[]).map(e=>e.name.toLowerCase()));
  const ql=q.trim().toLowerCase();
  const recent=[];exStats().forEach(x=>recent.push(x.name));
  const groups=[['Recent',recent.slice(0,8)]].concat(Object.entries(LIB));
  let h='',seen=new Set(),exact=false;
  if(ql){
    const hits=[];groups.forEach(([,list])=>list.forEach(n=>{const k=n.toLowerCase();if(k.includes(ql)&&!seen.has(k)){seen.add(k);hits.push(n);if(k===ql)exact=true}}));
    if(!exact)h+=`<button class="pick new" data-act="pick" data-name="${esc(q.trim())}">Add “${esc(q.trim())}”${I.plus.replace('<svg','<svg width="18" height="18"')}</button>`;
    h+=hits.map(n=>pickBtn(n,have)).join('');
  }else{
    groups.forEach(([g,list])=>{if(!list.length)return;h+=`<div class="pick-group">${g}</div>`+list.map(n=>pickBtn(n,have)).join('')});
  }
  document.getElementById('pick-list').innerHTML=h;
}
function pickBtn(n,have){const b=bestFor(n);return `<button class="pick" data-act="pick" data-name="${esc(n)}"><span>${esc(n)}</span><small>${have.has(n.toLowerCase())?'added':b?'best '+fw(b)+' '+unit():''}</small></button>`}

function openWorkout(id){
  const w=S.workouts[id];if(!w)return;
  const s=wkStats(w);
  const best={};finished().forEach(o=>{if(o.startedAt>=w.startedAt)return;o.exercises.forEach(e=>doneSets(e).forEach(x=>{const k=e.name.toLowerCase();if((x.w||0)>(best[k]||0))best[k]=x.w}))});
  const ex=w.exercises.map(e=>{const b=best[e.name.toLowerCase()]||0;return `<div class="detail-ex"><h3>${esc(e.name)}</h3><div class="detail-sets">${e.sets.map(x=>`<span class="pill${b>0&&(x.w||0)>b?' pr':''}">${esc(setTxt(x))}</span>`).join('')}</div></div>`}).join('');
  openSheet(`<div class="sheet-head"><h2>${esc(w.name)}</h2>${closeBtn}</div>
  <div class="sub">${new Date(w.startedAt).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} · ${new Date(w.startedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
  <div class="mini-stats"><div><b>${dur(w.finishedAt-w.startedAt)}</b><span>duration</span></div><div><b>${s.sets}</b><span>sets</span></div><div><b>${vol(s.v)}</b><span>${unit()} volume</span></div></div>
  ${ex}
  <div class="note">Gold sets beat your previous best for that exercise.</div>
  <div class="row-btns"><button class="btn primary" data-act="repeat" data-id="${w.id}">Repeat workout</button>
  <button class="btn soft danger" data-act="delete" data-id="${w.id}" data-confirm="Tap again to delete">Delete</button></div>`,'workout');
}

function openExercise(name){
  const x=exStats().find(e=>same(e.name,name));
  if(!x){openSheet(`<div class="sheet-head"><h2>${esc(name)}</h2>${closeBtn}</div><p class="note">Finish a workout with this exercise and its history and best sets will show here.</p>`);return}
  const rows=x.sessions.slice().reverse().map(s=>`<div class="detail-ex"><h3 style="font-size:14px;color:var(--ink-2);font-weight:600">${dFmt(s.t)}</h3><div class="detail-sets">${s.sets.map(z=>`<span class="pill">${esc(setTxt(z))}</span>`).join('')}</div></div>`).join('');
  openSheet(`<div class="sheet-head"><h2>${esc(x.name)}</h2>${closeBtn}</div>
  <div class="mini-stats"><div><b>${x.best>0?fw(x.best):'BW'}</b><span>heaviest ${unit()}</span></div><div><b>${x.best>0?fw(x.bestE):'—'}</b><span>est. 1-rep max</span></div><div><b>${x.sessions.length}</b><span>sessions</span></div></div>
  ${bigChart(x.sessions.slice(-20))}
  <div class="note">Heaviest set per session, in ${unit()}. Est. 1-rep max uses the Epley formula.</div>
  ${rows}`);
}

function openSettings(){
  const u=unit(),r=S.settings.rest;
  openSheet(`<div class="sheet-head"><h2>Settings</h2>${closeBtn}</div>
  <div class="setting"><label>Weight unit</label><div class="seg">${['kg','lb'].map(x=>`<button data-act="set-unit" data-v="${x}" aria-pressed="${u===x}">${x}</button>`).join('')}</div></div>
  <div class="setting"><label>Rest timer after each set</label><div class="seg">${[0,60,90,120,180].map(x=>`<button data-act="set-rest" data-v="${x}" aria-pressed="${r===x}">${x?clock(x*1000):'Off'}</button>`).join('')}</div></div>
  <div class="setting"><label>Backup</label>
  <p class="note" style="margin:0">Your workouts are stored only on this phone. Save a backup now and then, so you can restore them on a new phone or after clearing Chrome’s data.</p>
  <div class="row-btns"><button class="btn soft" data-act="export">Save backup</button><button class="btn soft" data-act="import">Restore backup</button></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden></div>`,'settings');
}

/* ---------- rest timer ---------- */
const restEl=document.getElementById('rest'),restT=document.getElementById('rest-t');
let restEnd=0,restBuzzed=false;
function startRest(){if(!S.settings.rest)return;restEnd=Date.now()+S.settings.rest*1000;restBuzzed=false;restEl.classList.remove('over');restEl.hidden=false;tickClocks()}
function stopRest(){restEnd=0;restEl.hidden=true;restEl.classList.remove('over')}
function tickClocks(){
  document.querySelectorAll('[data-elapsed]').forEach(el=>{el.textContent=clock(Date.now()-(+el.dataset.elapsed))});
  if(restEnd){
    const left=restEnd-Date.now();
    if(left<=0){restT.textContent='Go';if(!restBuzzed){restBuzzed=true;restEl.classList.add('over');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}setTimeout(()=>{if(restEnd&&Date.now()>restEnd+8000)stopRest()},9000)}}
    else restT.textContent=clock(left+999);
  }
}
setInterval(tickClocks,1000);

/* ---------- toast ---------- */
const toastEl=document.getElementById('toast');let toastT;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2600)}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(el.dataset.confirm&&!el.dataset.armed){
    el.dataset.armed='1';el.dataset.orig=el.innerHTML;el.textContent=el.dataset.confirm;
    if(el.classList.contains('icon-btn')){el.style.width='auto';el.style.padding='0 12px';el.style.color='var(--danger)';el.style.fontWeight='600';el.style.fontSize='14px'}
    setTimeout(()=>{if(el.isConnected&&el.dataset.armed){delete el.dataset.armed;el.innerHTML=el.dataset.orig;el.removeAttribute('style')}},3000);
    return;
  }
  const w=active();const ei=+el.dataset.ei,si=+el.dataset.si;
  switch(act){
    case 'tab':S.tab=el.dataset.tab;closeSheet();render();window.scrollTo({top:0});break;
    case 'settings':openSettings();break;
    case 'close-sheet':closeSheet();break;
    case 'template':{const n=document.getElementById('start-name');startWorkout((n&&n.value.trim())||el.dataset.t,TEMPLATES[el.dataset.t]);break}
    case 'start-empty':{const n=document.getElementById('start-name');startWorkout((n&&n.value.trim())||'Workout',[]);break}
    case 'picker':openPicker();setTimeout(()=>{const q=document.getElementById('pick-q');q&&q.focus()},350);break;
    case 'pick':if(w){w.exercises.push(newExercise(el.dataset.name));persist(w.id);closeSheet();render();setTimeout(()=>{const c=view.querySelectorAll('.ex');c.length&&c[c.length-1].scrollIntoView({behavior:'smooth',block:'center'})},60)}break;
    case 'ex-remove':if(w){w.exercises.splice(ei,1);persist(w.id);render()}break;
    case 'set-add':if(w){const e=w.exercises[ei];const l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:null,r:l?l.r:null,done:false});persist(w.id);render()}break;
    case 'set-remove':if(w){w.exercises[ei].sets.pop();persist(w.id);render()}break;
    case 'set-done':if(w){
      const e=w.exercises[ei],s=e.sets[si];
      if(!s.done){
        if(s.w==null){const p=placeholder(w,ei,si,'w');s.w=p!=null?p:0}
        if(s.r==null){const p=placeholder(w,ei,si,'r');if(p!=null)s.r=p}
        if(!(s.r>0)){toast('Enter your reps first');render();const inp=view.querySelector(`input[data-ei="${ei}"][data-si="${si}"][data-f="r"]`);inp&&inp.focus();return}
        s.done=true;const best=bestFor(e.name);
        if(best>0&&s.w>best)toast('New best: '+e.name+' '+fw(s.w)+' '+unit());
        startRest();
      }else s.done=false;
      persist(w.id);render();
    }break;
    case 'finish':finishWorkout();break;
    case 'discard':if(w){delete S.workouts[w.id];persist(w.id);stopRest();render();toast('Workout discarded')}break;
    case 'open-workout':openWorkout(el.dataset.id);break;
    case 'repeat':{const o=S.workouts[el.dataset.id];if(o)startWorkout(o.name,o.exercises.map(e=>e.name));break}
    case 'delete':{const id=el.dataset.id;delete S.workouts[id];persist(id);closeSheet();render();toast('Workout deleted');break}
    case 'ex-progress':openExercise(el.dataset.name);break;
    case 'set-unit':S.settings.unit=el.dataset.v;persist('settings');render();openSettings();break;
    case 'set-rest':S.settings.rest=+el.dataset.v;persist('settings');openSettings();break;
    case 'rest-add':restEnd=Math.max(Date.now()+1000,restEnd+ +el.dataset.s*1000);restBuzzed=false;restEl.classList.remove('over');tickClocks();break;
    case 'rest-stop':stopRest();break;
    case 'export':exportBackup();break;
    case 'import':document.getElementById('import-file').click();break;
  }
});
document.addEventListener('change',ev=>{if(ev.target.id==='import-file'&&ev.target.files[0])importBackup(ev.target.files[0])});
document.addEventListener('input',ev=>{
  const t=ev.target;const w=active();
  if(t.id==='pick-q'){fillPicker(t.value);return}
  if(!w)return;
  if(t.id==='wk-name'){w.name=t.value||'Workout';persist(w.id);return}
  if(t.dataset.f){
    const s=w.exercises[+t.dataset.ei].sets[+t.dataset.si];
    const raw=t.value.replace(',','.').trim();
    if(t.dataset.f==='w')s.w=raw===''?null:fromDisp(parseFloat(raw));
    else s.r=raw===''?null:Math.max(0,parseInt(raw,10)||0);
    persist(w.id);
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape')closeSheet();
  if(ev.key==='Enter'){
    if(ev.target.id==='start-name'){ev.preventDefault();startWorkout(ev.target.value.trim()||'Workout',[])}
    if(ev.target.id==='pick-q'&&ev.target.value.trim()){const w=active();if(w){w.exercises.push(newExercise(ev.target.value.trim()));persist(w.id);closeSheet();render()}}
    if(ev.target.classList.contains('num'))ev.target.blur();
  }
});
document.addEventListener('focusin',ev=>{if(ev.target.classList&&ev.target.classList.contains('num'))setTimeout(()=>{try{ev.target.select()}catch(e){}},0)});

loadLocal();
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
</body>
</html>
